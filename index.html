<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Задание 5 — Калькулятор заказа</title>
</head>

<body>

    <h1>Калькулятор стоимости заказа</h1>

    <!-- Выбор товара -->
    <label for="product">Выберите товар:</label>

    <select id="product">
        <option value="100">Ручка — 100 руб.</option>
        <option value="250">Тетрадь — 250 руб.</option>
        <option value="500">Книга — 500 руб.</option>
    </select>

    <br><br>

    <!-- Ввод количества -->
    <label for="quantity">Количество товара:</label>

    <input
        type="number"
        id="quantity"
        min="1"
        value="1"
    >

    <br><br>

    <!-- Кнопка расчёта -->
    <button onclick="calculatePrice()">
        Рассчитать стоимость
    </button>

    <!-- Вывод результата -->
    <p id="result"></p>

    <script>
        function calculatePrice() {

            // Получаем цену выбранного товара
            let product = document.getElementById("product");
            let price = Number(product.value);

            // Получаем количество товара
            let quantity = Number(
                document.getElementById("quantity").value
            );

            // Проверяем количество
            if (!Number.isInteger(quantity) || quantity < 1) {
                document.getElementById("result").textContent =
                    "Введите целое количество товара, не меньше 1.";
                return;
            }

            // Рассчитываем стоимость
            let total = price * quantity;

            // Выводим результат на страницу
            document.getElementById("result").textContent =
                "Стоимость заказа: " + total + " руб.";
        }
    </script>

</body>
</html>
